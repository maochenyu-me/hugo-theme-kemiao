{{- /* 页面英雄区：title/desc 必填，badges = [{text, href?}]，gradient 布尔可选 */}}
<section class="page-hero{{ if .gradient }} page-hero-gradient{{ end }}" data-aurora-hero>
  <div class="aurora-orb aurora-orb-1"></div>
  <div class="aurora-orb aurora-orb-2"></div>
  <div class="aurora-orb aurora-orb-3"></div>
  <div class="aurora-mouse" data-aurora-mouse></div>
  <div class="relative z-10">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl"><span class="glow-text">{{ .title }}</span></h1>
    {{- with .desc }}
    <p class="mt-3 max-w-2xl text-foreground/70 italic">{{ . }}</p>
    {{- end }}
    {{- with .badges }}
    <div class="mt-4 flex flex-wrap items-center gap-2 text-sm text-foreground/50">
      {{- range . }}
      {{- if .href }}
      <a class="hero-badge hero-link" href="{{ .href }}"{{ if hasPrefix .href "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .text }}</a>
      {{- else }}
      <span class="hero-badge">{{ .text }}</span>
      {{- end }}
      {{- end }}
    </div>
    {{- end }}
  </div>
</section>
