{{/* 防白闪：渲染前设置 data-theme / data-font-mode（与源站逻辑一致）。
     悠哉文楷是分片字体（首访约 900KB），默认不加载；用户在中控台开启时才注入其 CSS。 */}}
{{- $yozaiCss := (site.Params.fonts | default dict).yozaiCss | default "" -}}
<script>
  (function () {
    const AUTO = "auto";
    const LIGHT = "light";
    const DARK = "dark";
    const SETTINGS_KEY = "site-settings";
    const YOZAI_CSS = {{ $yozaiCss }};

    function isThemeMode(mode) {
      return [AUTO, LIGHT, DARK].includes(mode);
    }

    function readSettings() {
      try {
        const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        return settings && typeof settings === "object" ? settings : {};
      } catch {
        return {};
      }
    }

    function writeThemeMode(mode) {
      try {
        const settings = readSettings();
        settings["theme-mode"] = mode;
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        localStorage.removeItem("theme");
      } catch {
        // Theme persistence is progressive enhancement.
      }
    }

    function readThemeMode() {
      const settings = readSettings();
      if (isThemeMode(settings["theme-mode"])) return settings["theme-mode"];
      const legacyTheme = localStorage.getItem("theme");
      return isThemeMode(legacyTheme) ? legacyTheme : AUTO;
    }

    function readYozaiFontPreference() {
      const settings = readSettings();
      return typeof settings["yozai-font"] === "boolean" ? settings["yozai-font"] : false;
    }

    function applyFontMode(yozaiFont) {
      document.firstElementChild?.setAttribute("data-font-mode", yozaiFont ? "yozai" : "system");
    }

    function ensureYozaiCss() {
      if (!YOZAI_CSS || document.querySelector('link[data-yozai-css]')) return;
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = YOZAI_CSS;
      link.setAttribute("data-yozai-css", "");
      document.documentElement.appendChild(link);
    }

    window.ensureYozaiCss = ensureYozaiCss;

    function resolveTheme(mode) {
      if (mode === LIGHT || mode === DARK) return mode;
      const hour = new Date().getHours();
      return hour >= 18 || hour < 8 ? DARK : LIGHT;
    }

    const yozaiEnabled = readYozaiFontPreference();
    applyFontMode(yozaiEnabled);
    if (yozaiEnabled) ensureYozaiCss();

    const themeMode = readThemeMode();
    const resolvedTheme = resolveTheme(themeMode);
    writeThemeMode(themeMode);

    document.firstElementChild?.setAttribute("data-theme", resolvedTheme);

    window.theme = {
      themeMode,
      resolvedTheme,
      themeValue: resolvedTheme,
      getTheme: () => window.theme.resolvedTheme,
      getThemeMode: () => window.theme.themeMode,
      setTheme: val => {
        window.theme.resolvedTheme = val;
        window.theme.themeValue = val;
      },
      setThemeMode: val => {
        window.theme.themeMode = val;
        if (isThemeMode(val)) writeThemeMode(val);
      },
    };

    // PWA：延迟注册 Service Worker（首屏完成后，不阻塞 DOMContentLoaded）
    const registerSW = () => {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js", { scope: "/" })
          .then(reg => {
            // eslint-disable-next-line no-console
            console.log("[PWA] SW 注册成功:", reg.scope);
          })
          .catch(err => {
            // eslint-disable-next-line no-console
            console.error("[PWA] SW 注册失败:", err);
          });
      }
    };
    if (document.readyState === "complete") registerSW();
    else window.addEventListener("load", registerSW, { once: true });
  })();
</script>
