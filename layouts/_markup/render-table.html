{{- /* 表格 render hook：外层 .table-wrapper（圆角卡片）+ 内层 .table-wrapper-scroll（横向滚动）+ 滑动提示。超出容器宽度时由 JS 显示提示，保证移动端不撑破布局 */ -}}
<div class="table-wrapper">
  <div class="table-wrapper-scroll">
    <table
      {{- range $k, $v := .Attributes }}
        {{- if $v }}
          {{- printf " %s=%q" $k $v | safeHTMLAttr }}
        {{- end }}
      {{- end -}}
    >
      <thead>
        {{- range .THead }}
          <tr>
            {{- range . }}
              <th
                {{- with .Alignment }}
                  {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
                {{- end -}}
              >
                {{- .Text -}}
              </th>
            {{- end }}
          </tr>
        {{- end }}
      </thead>
      <tbody>
        {{- range .TBody }}
          <tr>
            {{- range . }}
              <td
                {{- with .Alignment }}
                  {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
                {{- end -}}
              >
                {{- .Text -}}
              </td>
            {{- end }}
          </tr>
        {{- end }}
      </tbody>
    </table>
  </div>
  <span class="table-wrapper-scroll-hint" data-scroll-hint hidden>左右滑动</span>
</div>
